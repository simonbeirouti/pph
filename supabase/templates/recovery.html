<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      color: #171717;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Arial,
        sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background-color: #f5f5f5"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="max-width: 560px; background-color: #ffffff"
          >
            <tr>
              <td align="center" style="padding-top: 32px">
                <img
                  src="{{ .SiteURL }}/icons/logo-transparent.png"
                  width="144"
                  alt="Pure Peninsula Honey"
                  style="
                    display: block;
                    width: 144px;
                    max-width: 100%;
                    height: auto;
                    border: 0;
                  "
                />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 32px; text-align: center">
                <h1
                  style="
                    margin: 0 0 12px;
                    color: #171717;
                    font-size: 26px;
                    line-height: 34px;
                  "
                >
                  Reset your password
                </h1>
                <p
                  style="
                    margin: 0 0 24px;
                    color: #525252;
                    font-size: 16px;
                    line-height: 26px;
                  "
                >
                  We received a request to reset your Pure Peninsula Honey
                  password. Choose a new password to get back to your work.
                </p>
                <table
                  role="presentation"
                  align="center"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                >
                  <tr>
                    <td
                      align="center"
                      bgcolor="#facc15"
                      style="border-radius: 8px"
                    >
                      <a
                        href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery"
                        style="
                          display: inline-block;
                          padding: 12px 20px;
                          color: #422006;
                          font-size: 15px;
                          font-weight: 700;
                          line-height: 20px;
                          text-decoration: none;
                        "
                      >
                        Reset password
                      </a>
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 24px 0 0;
                    color: #737373;
                    font-size: 13px;
                    line-height: 20px;
                  "
                >
                  If you did not request a password reset, you can safely ignore
                  this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
